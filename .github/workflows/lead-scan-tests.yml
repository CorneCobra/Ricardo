name: Leadscan tests

on:
  push:
    paths: ["lead-scan/**", ".github/workflows/lead-scan*.yml"]
  pull_request:
    paths: ["lead-scan/**", ".github/workflows/lead-scan*.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lead-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lead-scan/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check runner tests
      - run: python -m pytest -q
